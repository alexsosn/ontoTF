name: I-017 Pseudepigrapha coverage denominator

on:
  pull_request:
    paths:
      - "src/tfont/coverage.py"
      - "src/tfont/__init__.py"
      - "src/tfont/schemas/coverage-manifest.schema.json"
      - "src/tfont/resources/coverage/p004-pseudepigrapha-v1.0.0-v1/**"
      - "src/tfont/resources/coverage/p004-r011-baseline-v1/pseudepigrapha.json"
      - "docs/research/data/generated/i017/pseudepigrapha-v1.0.0.json"
      - "docs/research/data/i017/pseudepigrapha-denominator-policy.json"
      - "scripts/coverage/build_i017_pseudepigrapha_v1.py"
      - "tests/i017/**"
      - ".github/workflows/i017-pseudepigrapha-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i017:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i017 -p 'test*.py'
      - run: python scripts/coverage/build_i017_pseudepigrapha_v1.py --check
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist
      - name: Verify historical and current coverage resources in wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("tfont-*.whl"))
          expected = {
              "tfont/resources/coverage/p004-r011-baseline-v1/pseudepigrapha.json",
              "tfont/resources/coverage/p004-pseudepigrapha-v1.0.0-v1/pseudepigrapha.json",
          }
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = expected - names
          if missing:
              raise SystemExit(f"coverage wheel resources missing: {sorted(missing)}")
          PY
