name: I-019 TLHdig coverage denominator

on:
  pull_request:
    paths:
      - "src/tfont/coverage.py"
      - "src/tfont/__init__.py"
      - "src/tfont/schemas/coverage-manifest.schema.json"
      - "src/tfont/resources/coverage/p004-tlhdig-0.4.0-bc4a206-v1/**"
      - "src/tfont/resources/coverage/p004-r011-baseline-v1/tlhdig.json"
      - "src/tfont/resources/coverage/p004-pseudepigrapha-v1.0.0-v1/**"
      - "src/tfont/resources/coverage/p004-oracc-0.4.0-f6f189b-v1/**"
      - "docs/research/data/generated/i019/tlhdig-0.4.0.json"
      - "docs/research/data/i019/tlhdig-denominator-policy.json"
      - "scripts/coverage/build_i019_tlhdig_current.py"
      - "tests/i019/**"
      - ".github/workflows/i019-tlhdig-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i019:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i019 -p 'test*.py'
      - run: python scripts/coverage/build_i019_tlhdig_current.py --check
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist
      - name: Verify historical/current coverage resources and schema in wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("tfont-*.whl"))
          expected = {
              "tfont/resources/coverage/p004-r011-baseline-v1/tlhdig.json",
              "tfont/resources/coverage/p004-tlhdig-0.4.0-bc4a206-v1/tlhdig.json",
              "tfont/schemas/coverage-manifest.schema.json",
          }
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = expected - names
          if missing:
              raise SystemExit(f"I-019 wheel resources missing: {sorted(missing)}")
          PY
