name: I-005 semantic IR compiler

on:
  push:
    branches:
      - impl/i005-semantic-ir-compiler
  pull_request:
    paths:
      - 'tests/i005/**'
      - 'tests/i004/**'
      - 'docs/research/I-005-semantic-ir-compiler*.md'
      - 'docs/plans/I-005-semantic-ir-compiler*.md'
      - '.github/workflows/i005-semantic-ir.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Fixture validation controls
        run: python -m unittest tests.i005.test_fixture_controls -v
      - name: I-005 compiler contract
        run: python -m unittest discover -s tests/i005 -v
      - name: I-004 semantic validation regressions
        run: python -m unittest discover -s tests/i004 -v
