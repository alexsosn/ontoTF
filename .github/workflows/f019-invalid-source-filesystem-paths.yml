# Issue: #94
name: F-019 invalid source filesystem paths

on:
  push:
    branches:
      - research/f-019-invalid-source-filesystem-paths
    paths:
      - src/tfont/source_validation.py
      - tests/f019/**
      - tests/i001/**
      - docs/research/F-019-invalid-source-filesystem-paths.md
      - docs/research/F-019-cpython-path-conversion-evidence.md
      - docs/plans/F-019-invalid-source-filesystem-paths-plan.md
      - .github/workflows/f019-invalid-source-filesystem-paths.yml
  pull_request:
    paths:
      - src/tfont/source_validation.py
      - tests/f019/**
      - tests/i001/**
      - docs/research/F-019-invalid-source-filesystem-paths.md
      - docs/research/F-019-cpython-path-conversion-evidence.md
      - docs/plans/F-019-invalid-source-filesystem-paths-plan.md
      - .github/workflows/f019-invalid-source-filesystem-paths.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invalid-source-paths:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.12', '3.14']
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build
      - name: Run established F-019 controls
        run: python -m unittest tests.f019.test_invalid_source_filesystem_paths.InvalidSourceFilesystemPathControls -v
      - name: Run intended F-019 RED contract
        run: python -m unittest tests.f019.test_invalid_source_filesystem_paths.InvalidSourceFilesystemPathREDTests -v
      - name: Run I-001 source-loading regressions
        if: always()
        run: python -m unittest discover -s tests/i001 -v
