name: I-020 approximate-runtime reconciliation research

on:
  pull_request:
    paths:
      - "docs/research/I-020-approximate-resolution-execution.md"
      - "docs/research/data/generated/i020/runtime-reconciliation.json"
      - "scripts/research/i020_runtime_reconciliation.py"
      - ".github/workflows/i020-approximate-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Reconcile current exact runtime and reviewed approximation IR
        run: |
          python scripts/research/i020_runtime_reconciliation.py > /tmp/i020-runtime-reconciliation.json
          cat /tmp/i020-runtime-reconciliation.json
      - name: Compare committed evidence
        run: |
          cmp /tmp/i020-runtime-reconciliation.json docs/research/data/generated/i020/runtime-reconciliation.json
      - name: Re-run current exact resolver/executor guardrails
        run: |
          python -m unittest tests.i006.test_semantic_resolver_contract
          python -m unittest tests.i008.test_execution_red
          python -m unittest tests.i015.test_exact_conjunction_behavior
