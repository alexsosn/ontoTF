name: I-027B1 BHSA OLiA Verb

on:
  pull_request:
    paths:
      - "src/tfont/resources/profiles/bhsa/0.3.0/**"
      - "src/tfont/resources/coverage/p004-i027b1-bhsa-verb-v1/**"
      - "src/tfont/resources/ontologies/olia/**"
      - "src/tfont/production_bundles.py"
      - "docs/research/I-027B1-bhsa-olia-verb.md"
      - "docs/plans/I-027B1-bhsa-olia-verb.md"
      - "tests/i027b1/**"
      - ".github/workflows/i027b1-bhsa-verb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest tests.i027b1.test_verb_red tests.i027b1.test_verb_adversarial
