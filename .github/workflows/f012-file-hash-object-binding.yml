# Issue: #80
name: F-012 file hash object binding

on:
  push:
    branches:
      - stability/f-012-file-hash-object-binding
    paths:
      - src/tfont/parent_identity.py
      - tests/f010/**
      - tests/f012/**
      - tests/i003/**
      - docs/research/F-012-file-hash-object-binding.md
      - docs/plans/F-012-file-hash-object-binding-plan.md
      - .github/workflows/f012-file-hash-object-binding.yml
  pull_request:
    paths:
      - src/tfont/parent_identity.py
      - tests/f010/**
      - tests/f012/**
      - tests/i003/**
      - docs/research/F-012-file-hash-object-binding.md
      - docs/plans/F-012-file-hash-object-binding-plan.md
      - .github/workflows/f012-file-hash-object-binding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  object-binding:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.14']
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build
      - name: Run F-012 focused RED/GREEN contract
        run: python -m unittest discover -s tests/f012 -v
      - name: Run F-010 regression suite
        run: python -m unittest discover -s tests/f010 -v
      - name: Run I-003 regression suite
        run: python -m unittest discover -s tests/i003 -v
