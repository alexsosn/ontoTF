name: I-017 Pseudepigrapha release inventory research

on:
  pull_request:
    paths:
      - "scripts/research/i017_pseudepigrapha_release_inventory.py"
      - "docs/research/I-017-pseudepigrapha-current-denominator.md"
      - ".github/workflows/i017-pseudepigrapha-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Text-Fabric
        run: python -m pip install "text-fabric>=13.1,<14"
      - name: Download exact published native corpus archive
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/tf-1.0.zip \
            https://github.com/alexsosn/Pseudepigrapha-TF/releases/download/v1.0.0/tf-1.0.zip
      - name: Inventory exact release artifact
        run: |
          python scripts/research/i017_pseudepigrapha_release_inventory.py \
            /tmp/tf-1.0.zip \
            --expected-sha256 d2dfad7e643699617a9493b9f5d724868f8027dd5f2e88bd558451e3e7819b7a \
            --release-tag v1.0.0 \
            --release-commit 7c4b757bb543a110ae9a252d1281835859136852
