name: R-005 research inventory

on:
  push:
    branches:
      - research/r-005-corpus-semantic-census
    paths:
      - .github/workflows/r005-research-inventory.yml
      - scripts/research/r005_inventory.py
      - tests/research/test_r005_inventory.py
      - docs/research/R-005-corpus-semantic-census.md
      - docs/research/R-005-candidate-strength-matrix.md
      - docs/research/R-005-review-reconciliation.md
      - docs/research/data/R-005-corpus-pins.json
      - docs/research/data/generated/r005/**
  pull_request:
    paths:
      - scripts/research/r005_inventory.py
      - tests/research/test_r005_inventory.py
      - .github/workflows/r005-research-inventory.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Census mode (scoped or historical)
        default: scoped
        type: choice
        options: [scoped, historical]

permissions:
  contents: read

jobs:
  inventory:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'historical')
    runs-on: ubuntu-latest
    steps:
      - name: Check out TFont research branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Text-Fabric research baseline
        run: python -m pip install 'text-fabric==13.1.0'

      - name: Run research-tool unit tests
        run: python -m unittest discover -s tests/research -v

      - name: Check out BHSA 2021
        uses: actions/checkout@v5
        with:
          repository: ETCBC/bhsa
          ref: 4db00e2157915495e1a4d3d57e41223df24775da
          path: upstream/bhsa
          sparse-checkout: tf/2021
          sparse-checkout-cone-mode: false

      - name: Check out CUC 0.2.8
        uses: actions/checkout@v5
        with:
          repository: DT-UCPH/cuc
          ref: ad69400f5446e1c8217af01659c7c10ab00c015b
          path: upstream/cuc
          sparse-checkout: tf/0.2.8
          sparse-checkout-cone-mode: false

      - name: Check out ETCBC Syriac 0.9
        uses: actions/checkout@v5
        with:
          repository: ETCBC/syriac
          ref: bb0eaa7e21b020a26b7566d2e495da9b1f84a919
          path: upstream/syriac
          sparse-checkout: tf/0.9
          sparse-checkout-cone-mode: false

      - name: Check out Peshitta 0.2
        uses: actions/checkout@v5
        with:
          repository: ETCBC/peshitta
          ref: 9850f5addade26f681334aa475570bef9b0b440a
          path: upstream/peshitta
          sparse-checkout: tf/0.2
          sparse-checkout-cone-mode: false

      - name: Check out SyrNT 0.1
        uses: actions/checkout@v5
        with:
          repository: ETCBC/syrnt
          ref: dae3eb6ff62b9b272fb503646796c25d248175ce
          path: upstream/syrnt
          sparse-checkout: tf/0.1
          sparse-checkout-cone-mode: false

      - name: Check out ExtraBiblical 0.2
        uses: actions/checkout@v5
        with:
          repository: ETCBC/extrabiblical
          ref: 9a56288e6777bad6328856acf055c780e65dd5d9
          path: upstream/extrabiblical
          sparse-checkout: tf/0.2
          sparse-checkout-cone-mode: false

      - name: Check out TLHdig-TF 0.2.0
        uses: actions/checkout@v5
        with:
          repository: alexsosn/TLHdig-TF
          ref: 4309cf3318c682282c1480b233786362a3083471
          path: upstream/tlhdig
          sparse-checkout: tf/0.2.0
          sparse-checkout-cone-mode: false

      - name: Generate exact pinned inventories
        shell: bash
        run: |
          set -euo pipefail
          out=docs/research/data/generated/r005
          mkdir -p "$out"
          python scripts/research/r005_inventory.py upstream/bhsa/tf/2021 \
            --corpus-id bhsa --repository ETCBC/bhsa \
            --revision 4db00e2157915495e1a4d3d57e41223df24775da --tf-version 2021 \
            --output "$out/bhsa.json"
          python scripts/research/r005_inventory.py upstream/cuc/tf/0.2.8 \
            --corpus-id cuc --repository DT-UCPH/cuc \
            --revision ad69400f5446e1c8217af01659c7c10ab00c015b --tf-version 0.2.8 \
            --output "$out/cuc.json"
          python scripts/research/r005_inventory.py upstream/syriac/tf/0.9 \
            --corpus-id syriac --repository ETCBC/syriac \
            --revision bb0eaa7e21b020a26b7566d2e495da9b1f84a919 --tf-version 0.9 \
            --output "$out/syriac.json"
          python scripts/research/r005_inventory.py upstream/peshitta/tf/0.2 \
            --corpus-id peshitta --repository ETCBC/peshitta \
            --revision 9850f5addade26f681334aa475570bef9b0b440a --tf-version 0.2 \
            --output "$out/peshitta.json"
          python scripts/research/r005_inventory.py upstream/syrnt/tf/0.1 \
            --corpus-id syrnt --repository ETCBC/syrnt \
            --revision dae3eb6ff62b9b272fb503646796c25d248175ce --tf-version 0.1 \
            --output "$out/syrnt.json"
          python scripts/research/r005_inventory.py upstream/extrabiblical/tf/0.2 \
            --corpus-id extrabiblical --repository ETCBC/extrabiblical \
            --revision 9a56288e6777bad6328856acf055c780e65dd5d9 --tf-version 0.2 \
            --output "$out/extrabiblical.json"
          python scripts/research/r005_inventory.py upstream/tlhdig/tf/0.2.0 \
            --corpus-id tlhdig-tf --repository alexsosn/TLHdig-TF \
            --revision 4309cf3318c682282c1480b233786362a3083471 --tf-version 0.2.0 \
            --output "$out/tlhdig-tf.json"

      - name: Assert reviewer regression examples from generated CUC inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/research/data/generated/r005/cuc.json')
          d = json.loads(p.read_text())
          cert = d['node_features']['cert']
          emen = d['node_features']['emen']
          assert cert['observed_values'] == ['False', 'True'], cert
          assert set(emen['observed_values']) == {
              'restored', 'redundant', 'excised', 'missing', 'remark'
          }, emen
          assert cert['empty_observation_count'] > 0, cert
          assert emen['empty_observation_count'] > 0, emen
          print('CUC regression domains:', cert['observed_values'], emen['observed_values'])
          PY

      - name: Verify committed inventories are byte-for-byte current
        shell: bash
        run: |
          set -euo pipefail
          if git diff --exit-code -- docs/research/data/generated/r005; then
            echo 'Committed generated inventories exactly match regeneration on this head.'
          else
            echo 'Generated R-005 inventories are stale. Regenerate and commit them before review.' >&2
            exit 1
          fi

  scoped-inventory:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scoped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: bhsa
            repo: ETCBC/bhsa
            pin: 4db00e2157915495e1a4d3d57e41223df24775da
            version: "2021"
            values: "sp pdp gn prs_gn nu prs_nu ps prs_ps st vs vt ls typ function det rela kind domain dist_unit mother_object_type nametype language languageISO nme pfm prs uvf vbe vbs suffix_gender suffix_number suffix_person is_root"
            edge_values: ""
          - id: extrabiblical
            repo: ETCBC/extrabiblical
            pin: 9a56288e6777bad6328856acf055c780e65dd5d9
            version: "0.2"
            values: "sp pdp gn prs_gn nu prs_nu ps prs_ps st vs vt ls typ function det rela kind domain dist_unit mother_object_type language nme pfm prs uvf vbe vbs suffix_gender suffix_number suffix_person is_root"
            edge_values: ""
          - id: syriac
            repo: ETCBC/syriac
            pin: bb0eaa7e21b020a26b7566d2e495da9b1f84a919
            version: "0.9"
            values: "sp vs vt vo vpm gn nu ps st ls emf nme pfm pfx vbe vbs"
            edge_values: ""
          - id: syrnt
            repo: ETCBC/syrnt
            pin: dae3eb6ff62b9b272fb503646796c25d248175ce
            version: "0.1"
            values: "sp gn nu ps st vt vs nmtyp ntyp prtyp ptctyp demcat sfgn sfnu sfps sfcontract fmhdot seyame"
            edge_values: ""
          - id: peshitta
            repo: ETCBC/peshitta
            pin: 9850f5addade26f681334aa475570bef9b0b440a
            version: "0.2"
            values: "witness"
            edge_values: ""
          - id: cuc
            repo: DT-UCPH/cuc
            pin: ad69400f5446e1c8217af01659c7c10ab00c015b
            version: "0.2.8"
            values: "side emen cert cont language sign usign trailer_emen"
            edge_values: ""
          - id: pseudepigrapha
            repo: alexsosn/Pseudepigrapha-TF
            pin: 7c4b757bb543a110ae9a252d1281835859136852
            version: "1.0"
            values: "generation_marker is_metadata_only is_missing_unit_id is_omission is_primary is_source_anomaly synthetic_witness undefined_manuscript version_kind is_gap"
            edge_values: ""
          - id: tlhdig-tf
            repo: alexsosn/TLHdig-TF
            pin: e954600d9f9cc7f16570729813cf6bf3954b8f6d
            version: "0.4.0"
            values: "pos type sgr agr det num missing laes ras add quot materlect_anomalous cu_unrendered crossesline nested siglum_ambiguous from_open_marker from_close_marker mrpsel_kind sel_group parse_ok field4_kind cu_aligned ruling kind orphan fragment_kind siglum_source join_kind join_encoding join_resolved"
            edge_values: "joined witness_resolution"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'text-fabric==13.1.0'
      - run: python -m unittest tests.research.test_r005_inventory -v
      - uses: actions/checkout@v5
        if: matrix.id != 'pseudepigrapha'
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.pin }}
          path: upstream/corpus
          sparse-checkout: tf/${{ matrix.version }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Acquire verified Pseudepigrapha release
        if: matrix.id == 'pseudepigrapha'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 -o corpus.zip https://github.com/alexsosn/Pseudepigrapha-TF/releases/download/v1.0.0/tf-1.0.zip
          echo 'd2dfad7e643699617a9493b9f5d724868f8027dd5f2e88bd558451e3e7819b7a  corpus.zip' | sha256sum --check
          mkdir -p upstream/corpus/tf/1.0
          python -m zipfile -e corpus.zip upstream/corpus/tf/1.0
      - name: Generate scoped inventory from actual TF
        env:
          ID: ${{ matrix.id }}
          REPO: ${{ matrix.repo }}
          PIN: ${{ matrix.pin }}
          VERSION: ${{ matrix.version }}
          VALUES: ${{ matrix.values }}
          EDGE_VALUES: ${{ matrix.edge_values }}
        run: |
          set -euo pipefail
          mkdir -p scoped
          # Word splitting here is intentional for the source-reviewed feature names.
          python scripts/research/r005_inventory.py "upstream/corpus/tf/$VERSION" \
            --scoped --corpus-id "$ID" --repository "$REPO" --revision "$PIN" --tf-version "$VERSION" \
            --node-value-features $VALUES --edge-value-features $EDGE_VALUES \
            --output "scoped/$ID.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("scoped") / (os.environ["ID"] + ".json")
          data = json.loads(path.read_text())
          assert data["node_types"]
          for name, info in data["node_features"].items():
              for scope in info["scopes"].values():
                  if scope.get("value_domain") == "complete_observed":
                      assert sum(scope["values"].values()) == scope["count"], name
          for name, info in data["edge_features"].items():
              for pair in info["pairs"]:
                  if pair.get("value_domain") == "complete_observed":
                      assert sum(pair["values"].values()) + pair.get("empty_values", 0) == pair["count"], name
          print("Node types:", data["node_types"])
          print("Scoped node features:", sum(len(x["scopes"]) for x in data["node_features"].values()))
          print("Directed edge pairs:", sum(len(x["pairs"]) for x in data["edge_features"].values()))
          print("Complete selected node values:", sum(len(x.get("values", {})) for f in data["node_features"].values() for x in f["scopes"].values()))
          if data["corpus_id"] == "extrabiblical":
              rela = data["node_features"]["rela"]["scopes"]["clause"]["values"]
              assert rela["Adju"] == 727 and rela["Subj"] == 78 and sum(rela.values()) == 8908, rela
              assert data["node_types"]["word"] == 39862
          # The compact observed inventory is also available in the job log for
          # reproducible review. It contains selected categorical labels only.
          print("SCOPED_CENSUS_JSON=" + json.dumps(data, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scoped-${{ matrix.id }}
          path: scoped/*.json
          if-no-files-found: error
