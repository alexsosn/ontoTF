name: I-018 ORACC coverage denominator

on:
  pull_request:
    paths:
      - "src/tfont/coverage.py"
      - "src/tfont/__init__.py"
      - "src/tfont/resources/coverage/p004-oracc-0.4.0-f6f189b-v1/**"
      - "src/tfont/resources/coverage/p004-r011-baseline-v1/oracc.json"
      - "docs/research/data/generated/i018/oracc-0.4.0.json"
      - "docs/research/data/i018/oracc-denominator-policy.json"
      - "scripts/coverage/build_i018_oracc_current.py"
      - "tests/i018/**"
      - ".github/workflows/i018-oracc-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i018:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i018 -p 'test*.py'
      - run: python scripts/coverage/build_i018_oracc_current.py --check
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist
      - name: Verify historical and current ORACC coverage resources in wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("tfont-*.whl"))
          expected = {
              "tfont/resources/coverage/p004-r011-baseline-v1/oracc.json",
              "tfont/resources/coverage/p004-oracc-0.4.0-f6f189b-v1/oracc.json",
          }
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = expected - names
          if missing:
              raise SystemExit(f"ORACC coverage wheel resources missing: {sorted(missing)}")
          PY
