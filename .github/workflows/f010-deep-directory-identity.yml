# Issue: #71
name: F-010 deep directory identity

on:
  push:
    branches:
      - stability/f-010-deep-directory-identity
    paths:
      - src/tfont/parent_identity.py
      - tests/f010/**
      - tests/i003/**
      - docs/research/F-010-deep-directory-identity.md
      - docs/plans/F-010-deep-directory-identity-plan.md
      - .github/workflows/f010-deep-directory-identity.yml
  pull_request:
    paths:
      - src/tfont/parent_identity.py
      - tests/f010/**
      - tests/i003/**
      - docs/research/F-010-deep-directory-identity.md
      - docs/plans/F-010-deep-directory-identity-plan.md
      - .github/workflows/f010-deep-directory-identity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directory-traversal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and packaging frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build

      - name: Run F-010 focused RED/GREEN contract
        run: python -m unittest discover -s tests/f010 -v

      - name: Run I-003 identity regressions
        run: python -m unittest discover -s tests/i003 -v
