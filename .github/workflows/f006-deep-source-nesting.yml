# Issue: #32
name: F-006 deep source nesting

on:
  push:
    branches:
      - fix/deep-source-nesting
    paths:
      - src/tfont/source_validation.py
      - tests/f006/**
      - tests/i001/**
      - tests/packaging/**
      - docs/research/F-006-deep-source-nesting.md
      - docs/plans/F-006-deep-source-nesting-plan.md
      - .github/workflows/f006-deep-source-nesting.yml
  pull_request:
    paths:
      - src/tfont/source_validation.py
      - tests/f006/**
      - tests/i001/**
      - tests/packaging/**
      - docs/research/F-006-deep-source-nesting.md
      - docs/plans/F-006-deep-source-nesting-plan.md
      - .github/workflows/f006-deep-source-nesting.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-depth:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and full test frontend
        run: |
          python -m pip install -e .
          python -m pip install build
      - name: Focused F-006 tests
        run: python -m unittest discover -s tests/f006 -v
      - name: I-001 source-loading regressions
        run: python -m unittest discover -s tests/i001 -v
