name: Repair compatibility after package rename
on:
  push:
    branches: [rename-ontotf]
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/rename-ontotf'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore stable legacy protocol identifiers without restoring branding
        run: |
          python - <<'PY'
          import pathlib, re, subprocess
          base = '6dfc98178374dfbfe005ba1c277d9a5f784328ae'
          old = 'tfont'
          new = 'ontotf'
          def git(*args):
              return subprocess.check_output(['git', *args])
          names = git('ls-tree', '-r', '--name-only', '-z', base).decode().split('\0')
          # The old wire-format IDs are immutable, unlike import paths and distribution names.
          # Collect exact identifiers from the original implementation and packaged data.
          token = re.compile(r'(?<![A-Za-z0-9_])tfont-[a-z0-9-]+')
          stable = set()
          for name in names:
              if not name.startswith('src/tfont/') or name.startswith('src/tfont/mappings/'):
                  continue
              if not name.endswith(('.py', '.json')):
                  continue
              raw = git('show', base + ':' + name).decode()
              stable.update(token.findall(raw))
          # Fixed vectors use this synthetic identifier as an input, not a package name.
          stable.add('tfont-test')
          print('Stable legacy tokens:', sorted(stable))
          pattern = re.compile(r'(?<![A-Za-z0-9_])ontotf-[a-z0-9-]+')
          changed = []
          for name in names:
              if not name or name.startswith('.github/workflows/'):
                  continue
              p = pathlib.Path(name.replace('src/tfont/', 'src/ontotf/'))
              if not p.is_file():
                  continue
              raw = p.read_bytes()
              if b'ontotf' not in raw and b'ontoTF' not in raw:
                  continue
              s = raw.decode('utf-8')
              previous = s
              s = pattern.sub(lambda m: old + m.group()[len(new):] if old + m.group()[len(new):] in stable else m.group(), s)
              s = s.replace('minimum_ontotf_runtime', 'minimum_tfont_runtime')
              s = s.replace('https://ontotf.dev/schema/', 'https://tfont.dev/schema/')
              # Resource provenance URIs and derived resource identities are wire values.
              s = re.sub(r'(?<![A-Za-z0-9_])ontotf:(?=resources/|schemas/|derived:)', 'tfont:', s)
              if name in ('src/tfont/published_deltas.py', 'src/tfont/release_registry.py'):
                  s = s.replace('ontotf-{', 'tfont-{')
              if name == 'tests/i002/test_digests.py':
                  s = s.replace('ontoTF evidence', 'TFont evidence')
              if s != previous:
                  p.write_bytes(s.encode('utf-8'))
                  changed.append(str(p))
          print('Restored stable protocol literals in', len(changed), 'files')
          # Verify frozen profile/resource bytes against original tree, rather than blessing new checksums.
          for name in names:
              if name.startswith('src/tfont/resources/profiles/') and '/0.1.0/' in name:
                  assert pathlib.Path(name.replace('src/tfont/', 'src/ontotf/')).read_bytes() == git('show', base+':'+name), name
          PY
      - name: Commit only source compatibility corrections
        run: |
          git add -A
          git reset -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Preserve stable legacy wire identifiers during package rename"
            git push origin HEAD:rename-ontotf
          fi
      - name: Run focused compatibility tests
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/i002 tests/i003 tests/i009 tests/i015 tests/i016 tests/i020 tests/i027a tests/i033e --tb=short
