# Issue: #95
name: F-020 invalid schema-root filesystem paths

on:
  push:
    branches:
      - research/f-020-invalid-schema-root-paths
    paths:
      - src/tfont/source_validation.py
      - tests/f020/**
      - tests/f019/**
      - tests/i001/**
      - tests/packaging/test_schema_authority.py
      - docs/research/F-020-invalid-schema-root-filesystem-paths.md
      - docs/plans/F-020-invalid-schema-root-filesystem-paths-plan.md
      - .github/workflows/f020-invalid-schema-root-filesystem-paths.yml
  pull_request:
    paths:
      - src/tfont/source_validation.py
      - tests/f020/**
      - tests/f019/**
      - tests/i001/**
      - tests/packaging/test_schema_authority.py
      - docs/research/F-020-invalid-schema-root-filesystem-paths.md
      - docs/plans/F-020-invalid-schema-root-filesystem-paths-plan.md
      - .github/workflows/f020-invalid-schema-root-filesystem-paths.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f020-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  invalid-schema-root-paths:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.12', '3.14']
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build

      - name: Run established F-020 controls
        run: python -m unittest tests.f020.test_invalid_schema_root_filesystem_paths.InvalidSchemaRootFilesystemPathControls -v

      - name: Run intended F-020 RED/GREEN contract
        run: python -m unittest tests.f020.test_invalid_schema_root_filesystem_paths.InvalidSchemaRootFilesystemPathREDTests -v

      - name: Run I-001 source-validation regressions
        if: always()
        run: python -m unittest discover -s tests/i001 -v

      - name: Run F-019 source-path regressions
        if: always()
        run: python -m unittest discover -s tests/f019 -v

      - name: Run packaged schema-authority regression
        if: always()
        run: python -m unittest tests.packaging.test_schema_authority -v
