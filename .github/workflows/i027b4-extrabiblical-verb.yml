name: I-027B4 ExtraBiblical OLiA Verb

on:
  pull_request:
    paths:
      - "src/tfont/resources/profiles/extrabiblical/0.3.0/**"
      - "src/tfont/resources/coverage/p004-i027b4-extrabiblical-verb-v1/**"
      - "scripts/coverage/build_i027b4_extrabiblical_verb.py"
      - "docs/research/I-027B4-extrabiblical-verb.md"
      - "docs/plans/I-027B4-extrabiblical-verb.md"
      - "tests/i027b4/**"
      - ".github/workflows/i027b4-extrabiblical-verb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python scripts/coverage/build_i027b4_extrabiblical_verb.py --check
      - run: python -m unittest tests.i027b4.test_verb_red tests.i027b4.test_verb_adversarial
