name: I-002 canonicalization and digests

on:
  push:
    branches:
      - impl/i-002-canonical-digests
    paths:
      - .github/workflows/i002-validation.yml
      - docs/research/I-002-canonicalization-digest-research.md
      - docs/plans/I-002-canonicalization-digest-plan.md
      - pyproject.toml
      - src/tfont/**
      - tests/i002/**
  pull_request:
    paths:
      - .github/workflows/i002-validation.yml
      - docs/research/I-002-canonicalization-digest-research.md
      - docs/plans/I-002-canonicalization-digest-plan.md
      - pyproject.toml
      - tests/i002/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Show environment
        run: |
          python --version
          python -c "import importlib.metadata as m; print('rfc8785', m.version('rfc8785') if any(d.metadata['Name'] == 'rfc8785' for d in m.distributions()) else 'not-installed')"

      - name: Run I-002 focused tests
        run: python -m unittest discover -s tests/i002 -v
