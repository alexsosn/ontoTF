# Issue: #69
name: F-009 deep digest nesting

on:
  push:
    branches:
      - stability/f-009-deep-digest-nesting
    paths:
      - src/tfont/digests.py
      - src/tfont/__init__.py
      - tests/f009/**
      - tests/i002/**
      - docs/research/F-009-deep-digest-nesting.md
      - docs/plans/F-009-deep-digest-nesting-plan.md
      - .github/workflows/f009-deep-digest-nesting.yml
  pull_request:
    paths:
      - src/tfont/digests.py
      - src/tfont/__init__.py
      - tests/f009/**
      - tests/i002/**
      - docs/research/F-009-deep-digest-nesting.md
      - docs/plans/F-009-deep-digest-nesting-plan.md
      - .github/workflows/f009-deep-digest-nesting.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nesting-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build

      - name: Run F-009 focused RED/GREEN contract
        run: python -m unittest discover -s tests/f009 -v

      - name: Run I-002 regression suite
        run: python -m unittest discover -s tests/i002 -v
