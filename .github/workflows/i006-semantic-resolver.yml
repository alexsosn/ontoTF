name: I-006 exact semantic resolver

on:
  push:
    branches:
      - impl/i006-exact-semantic-resolver
  pull_request:
    paths:
      - 'tests/i006/**'
      - 'tests/i005/**'
      - 'tests/i004/**'
      - 'docs/research/I-006*.md'
      - 'docs/plans/I-006*.md'
      - '.github/workflows/i006-semantic-resolver.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: I-006 fixture controls
        run: python -m unittest tests.i006.test_fixture_controls -v
      - name: I-006 resolver contract
        run: python -m unittest discover -s tests/i006 -v
      - name: I-005 semantic IR regressions
        if: always()
        run: python -m unittest discover -s tests/i005 -v
      - name: I-004 semantic validation regressions
        if: always()
        run: python -m unittest discover -s tests/i004 -v
