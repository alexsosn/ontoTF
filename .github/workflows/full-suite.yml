name: Full repository suite

on:
  push:
    branches: [main]
  # All PR paths, including scripts and decision/evidence ledgers, need the
  # exact-head regression. Branch pushes use this PR event to avoid duplicates.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and packaging frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build pytest

      - name: Run repository test suite
        run: python -m unittest discover -s tests -v

      - name: Execute previously hidden pytest research contracts
        run: python -m pytest tests/research -q

      - name: Run TF-native architecture guards
        run: python -m pytest tests/architecture -q

      # F-030 phase 3: retain repository-wide F-series research/workflow
      # ownership enforcement while retiring six duplicated Linux jobs.
      - name: Check F-series repository ownership
        run: python scripts/check_f_series_ownership.py .

      - name: Verify immutable historical coverage and routing snapshots
        if: matrix.python-version == '3.12'
        run: |
          python scripts/coverage/build_p004_r011_baseline.py --check
          python scripts/coverage/build_i026_work_queue.py --check
          python scripts/coverage/build_i017_pseudepigrapha_v1.py --check
          python scripts/coverage/build_i018_oracc_current.py --check
          python scripts/coverage/build_i019_tlhdig_current.py --check

      # F-030: historical offline coverage reproducibility previously ran
      # in seven duplicative I-026/I-027 per-ticket workflows. Full test
      # discovery already covers their unit and adversarial suites.
      - name: Verify pinned POS and current-queue coverage successors
        run: |
          python scripts/coverage/build_i027a_bhsa_verbal_stems.py --check
          python scripts/coverage/build_i027b1_bhsa_verb.py --check
          python scripts/coverage/build_i027b2_syriac_verb.py --check
          python scripts/coverage/build_i027b4_extrabiblical_verb.py --check
          python scripts/coverage/build_i027c2_bhsa_adj_adv.py --check
          python scripts/coverage/build_i027c2_syriac_adj_adv.py --check
          python scripts/coverage/build_i027d_current_queue.py --check

      - name: Build exact-head distributable wheel
        run: python -m build --wheel --outdir dist

      - name: Verify frozen seven-corpus coverage files inside wheel
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          dist = tuple(Path("dist").glob("tfont-*.whl"))
          if len(dist) != 1:
              raise SystemExit("expected exactly one built wheel")
          prefix = "tfont/resources/coverage/p004-r011-baseline-v1/"
          expected = {
              prefix + name for name in (
                  "bhsa.json", "cuc.json", "syriac.json", "extrabiblical.json",
                  "pseudepigrapha.json", "oracc.json", "tlhdig.json",
              )
          }
          with ZipFile(dist[0]) as wheel:
              present = {name for name in wheel.namelist() if name.startswith(prefix)}
          if present != expected:
              raise SystemExit("missing or unexpected frozen coverage resources in wheel")
          successors = {
              "tfont/resources/coverage/p004-pseudepigrapha-v1.0.0-v1/pseudepigrapha.json",
              "tfont/resources/coverage/p004-oracc-0.4.0-f6f189b-v1/oracc.json",
              "tfont/resources/coverage/p004-tlhdig-0.4.0-bc4a206-v1/tlhdig.json",
              "tfont/schemas/coverage-manifest.schema.json",
          }
          with ZipFile(dist[0]) as wheel:
              missing = successors - set(wheel.namelist())
          if missing:
              raise SystemExit(f"missing successor coverage resources in wheel: {sorted(missing)}")
          PY

      - name: Install reviewed profile wheel in isolated environment
        if: matrix.python-version == '3.12'
        env:
          I009_WHEEL_TEST: "1"
        run: python -m unittest tests.i009.test_wheel_install_red -v
