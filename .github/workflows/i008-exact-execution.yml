name: I-008 exact loaded execution

on:
  push:
    branches:
      - impl/i008-exact-execution
  pull_request:
    paths:
      - 'src/tfont/semantic_execution.py'
      - 'src/tfont/__init__.py'
      - 'src/tfont/runtime_prerequisites.py'
      - 'src/tfont/runtime_tf_observation.py'
      - 'src/tfont/semantic_resolver.py'
      - 'src/tfont/semantic_ir.py'
      - 'tests/i008/**'
      - 'tests/i007/**'
      - 'tests/i006/**'
      - 'docs/research/I-008*.md'
      - 'docs/plans/I-008*.md'
      - '.github/workflows/i008-exact-execution.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: I-008 fixture controls
        run: python -m unittest tests.i008.test_fixture_controls -v
      - name: I-008 execution contract
        run: python -m unittest discover -s tests/i008 -p 'test_*red.py' -v
      - name: I-007 runtime prerequisite regressions
        if: always()
        run: python -m unittest discover -s tests/i007 -v
      - name: I-006 resolver regressions
        if: always()
        run: python -m unittest discover -s tests/i006 -v

  context-fabric-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python -m pip install 'context-fabric==0.5.7'
      - name: I-008 fixture controls
        run: python -m unittest tests.i008.test_fixture_controls -v
      - name: I-008 execution contract
        run: python -m unittest discover -s tests/i008 -p 'test_*red.py' -v
      - name: Real Context-Fabric fixture and execution smoke
        run: python -m unittest tests.i008.test_context_fabric_integration -v
