name: I-001 structural validator

on:
  push:
    branches:
      - impl/i-001-structural-validator
    paths:
      - .github/workflows/i001-validation.yml
      - docs/research/I-001-structural-validator-research.md
      - docs/plans/I-001-structural-validator-plan.md
      - pyproject.toml
      - src/tfont/**
      - tests/i001/**
      - tests/packaging/**
  pull_request:
    paths:
      - .github/workflows/i001-validation.yml
      - docs/research/I-001-structural-validator-research.md
      - docs/plans/I-001-structural-validator-plan.md
      - pyproject.toml
      - tests/i001/**
      - tests/packaging/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build

      - name: Show validation dependency versions
        run: |
          python --version
          python -c "import jsonschema, ruamel.yaml; print('jsonschema', jsonschema.__version__); print('ruamel.yaml', ruamel.yaml.__version__)"

      - name: Run I-001 contract tests
        run: python -m unittest discover -s tests/i001 -v
