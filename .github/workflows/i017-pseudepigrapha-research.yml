name: I-017 Pseudepigrapha release inventory research

on:
  pull_request:
    paths:
      - "scripts/research/r005_inventory.py"
      - "docs/research/I-017-pseudepigrapha-current-denominator.md"
      - "docs/research/data/generated/i017/pseudepigrapha-v1.0.0.json"
      - ".github/workflows/i017-pseudepigrapha-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Text-Fabric
        run: python -m pip install "text-fabric==13.1.0"
      - name: Download and verify exact published native corpus archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/tf-1.0.zip \
            https://github.com/alexsosn/Pseudepigrapha-TF/releases/download/v1.0.0/tf-1.0.zip
          echo "d2dfad7e643699617a9493b9f5d724868f8027dd5f2e88bd558451e3e7819b7a  /tmp/tf-1.0.zip" \
            | sha256sum --check -
          mkdir /tmp/pseudepigrapha-tf-1.0
          unzip -q /tmp/tf-1.0.zip -d /tmp/pseudepigrapha-tf-1.0
      - name: Run established R-005 exhaustive TF inventory
        run: |
          set -euo pipefail
          python scripts/research/r005_inventory.py \
            /tmp/pseudepigrapha-tf-1.0 \
            --corpus-id pseudepigrapha \
            --repository alexsosn/Pseudepigrapha-TF \
            --revision 7c4b757bb543a110ae9a252d1281835859136852 \
            --tf-version 1.0 \
            --output /tmp/i017-pseudepigrapha-r005.json
          echo I017_R005_INVENTORY_BEGIN
          cat /tmp/i017-pseudepigrapha-r005.json
          echo I017_R005_INVENTORY_END
      - name: Verify committed compact evidence matches regenerated inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path("/tmp/i017-pseudepigrapha-r005.json").read_text(encoding="utf-8"))
          compact = json.loads(
              Path("docs/research/data/generated/i017/pseudepigrapha-v1.0.0.json").read_text(encoding="utf-8")
          )
          release = compact["release"]

          identity_pairs = {
              "repository": (raw["repository"], release["repository"]),
              "revision": (raw["revision"], release["commit"]),
              "tf_version": (raw["tf_version"], release["tf_version"]),
              "tf_files_sha256": (raw["tf_files_sha256"], release["tf_files_sha256"]),
          }
          for name, (observed, committed) in identity_pairs.items():
              if observed != committed:
                  raise SystemExit(f"{name} mismatch: regenerated={observed!r} committed={committed!r}")

          for key in ("slot_type", "node_types", "excluded_warp_features", "domain_policy"):
              if raw[key] != compact[key]:
                  raise SystemExit(f"{key} differs from regenerated inventory")

          if set(raw["node_features"]) != set(compact["node_features"]):
              raise SystemExit("node feature set differs from regenerated inventory")
          for name, committed in compact["node_features"].items():
              source = raw["node_features"][name]
              projected = {
                  "description": source["metadata"]["description"],
                  "value_type": source["metadata"]["valueType"],
                  "documentation_category": source["metadata"]["documentationCategory"],
                  "applies_to": source["applies_to"],
                  "nodes_with_value": source["nodes_with_value"],
                  "observed_unique_count": source["observed_unique_count"],
                  "domain_observation": source["domain_observation"],
              }
              if "observed_values" in committed:
                  projected["observed_values"] = source.get("observed_values", [])
              if committed != projected:
                  raise SystemExit(f"node feature evidence differs for {name}")

          if set(raw["edge_features"]) != set(compact["edge_features"]):
              raise SystemExit("edge feature set differs from regenerated inventory")
          for name, committed in compact["edge_features"].items():
              source = raw["edge_features"][name]
              projected = {
                  "description": source["metadata"]["description"],
                  "source_types": source["source_types"],
                  "target_types": source["target_types"],
                  "edge_count": source["edge_count"],
                  "valued": source["valued"],
              }
              if committed != projected:
                  raise SystemExit(f"edge feature evidence differs for {name}")
          PY
