name: I-012 v0.1 clean-wheel acceptance

on:
  push:
    branches:
      - impl/i012-clean-install-acceptance
    paths:
      - 'scripts/acceptance/v01_noun.py'
      - '.github/workflows/i012-v01-acceptance.yml'
  pull_request:
    paths:
      - 'scripts/acceptance/v01_noun.py'
      - '.github/workflows/i012-v01-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    name: clean-wheel acceptance (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build candidate wheel
        run: |
          python -m pip install build
          mkdir -p "$RUNNER_TEMP/i012-wheelhouse"
          python -m build --wheel --outdir "$RUNNER_TEMP/i012-wheelhouse"
          count="$(find "$RUNNER_TEMP/i012-wheelhouse" -maxdepth 1 -type f -name '*.whl' | wc -l)"
          test "$count" -eq 1
      - name: Fresh-install candidate wheel outside checkout
        run: |
          VENV="$RUNNER_TEMP/i012-${{ matrix.python-version }}-venv"
          python -m venv "$VENV"
          WHEEL="$(find "$RUNNER_TEMP/i012-wheelhouse" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          "$VENV/bin/python" -m pip install "$WHEEL"
      - name: Run copied acceptance artifact outside checkout
        run: |
          test -f "$GITHUB_WORKSPACE/scripts/acceptance/v01_noun.py" || {
            echo 'I-012 RED: scripts/acceptance/v01_noun.py is intentionally absent'
            exit 17
          }
          VENV="$RUNNER_TEMP/i012-${{ matrix.python-version }}-venv"
          WORK="$RUNNER_TEMP/i012-${{ matrix.python-version }}-work"
          mkdir -p "$WORK"
          cp "$GITHUB_WORKSPACE/scripts/acceptance/v01_noun.py" "$WORK/v01_noun.py"
          cd "$WORK"
          unset PYTHONPATH PYTHONHOME
          OUTPUT="$(TFONT_ACCEPTANCE_FORBID_ROOT="$GITHUB_WORKSPACE" "$VENV/bin/python" -I v01_noun.py)"
          printf '%s\n' "$OUTPUT"
          FINAL="$(printf '%s\n' "$OUTPUT" | tail -n 1)"
          "$VENV/bin/python" -I -c '
          import json, sys
          row = json.loads(sys.argv[1])
          assert row["contract"] == "tfont-v01-noun-acceptance-v1"
          assert row["status"] == "pass"
          assert row["corpora"] == {"bhsa": [1, 2], "extrabiblical": [21, 22], "syriac": [11, 12]}
          ' "$FINAL"
