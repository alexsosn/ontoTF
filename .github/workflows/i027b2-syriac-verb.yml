name: I-027B2 Syriac OLiA Verb

on:
  pull_request:
    paths:
      - "src/tfont/resources/profiles/syriac/0.3.0/**"
      - "src/tfont/resources/coverage/p004-i027b2-syriac-verb-v1/**"
      - "docs/research/I-027B2-syriac-extra-verb.md"
      - "docs/plans/I-027B2-syriac-extra-verb.md"
      - "scripts/coverage/build_i027b2_syriac_verb.py"
      - "tests/i027b2/**"
      - ".github/workflows/i027b2-syriac-verb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python scripts/coverage/build_i027b2_syriac_verb.py --check
      - run: python -m unittest tests.i027b2.test_syriac_verb_red tests.i027b2.test_syriac_verb_adversarial
