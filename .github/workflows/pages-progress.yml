name: Mapping progress Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/tfont/mappings/**'
      - 'src/tfont/xml_mappings.py'
      - 'docs/research/data/**'
      - 'scripts/pages/**'
      - 'tests/mapping_catalog/test_progress_tracker.py'
      - '.github/workflows/pages-progress.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'scripts/pages/**'
      - 'tests/mapping_catalog/test_progress_tracker.py'
      - '.github/workflows/pages-progress.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mapping-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest tests.mapping_catalog.test_progress_tracker -v
      - run: python -m scripts.pages.build_progress --out _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
