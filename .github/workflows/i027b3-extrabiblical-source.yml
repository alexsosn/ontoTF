name: I-027B3 ExtraBiblical original MQL evidence

on:
  pull_request:
    paths:
      - "scripts/research/i027b3_extract_mql.py"
      - "tests/i027b3/**"
      - "docs/research/I-027B3-extrabiblical-mql-evidence.md"
      - "docs/research/data/i027b3/**"
      - "docs/research/data/i034f/**"
      - "docs/plans/I-027B3-extrabiblical-mql-evidence.md"
      - ".github/workflows/i027b3-extrabiblical-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Offline extractor unit and adversarial tests
        run: python -m unittest tests.i027b3.test_source_red tests.i027b3.test_source_adversarial tests.i027b3.test_pos_enum_red
      - uses: actions/checkout@v5
        with:
          repository: ETCBC/extrabiblical
          ref: 9a56288e6777bad6328856acf055c780e65dd5d9
          path: upstream
          persist-credentials: false
      - name: Check pinned commit and extract bounded evidence
        shell: bash
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "9a56288e6777bad6328856acf055c780e65dd5d9"
          # Bounded original-schema diagnostic, even when strict parser fails.
          # Never emit corpus tokens or the large MQL payload.
          python - <<'PY'
          import bz2
          import hashlib
          from pathlib import Path
          from scripts.research.i027b3_extract_mql import git_blob_sha, PINNED_BLOB_SHA
          raw = Path("upstream/source/0.2/extraBiblical.mql.bz2").read_bytes()
          assert git_blob_sha(raw) == PINNED_BLOB_SHA
          lines = bz2.decompress(raw).decode("utf-8").splitlines()
          enum_start = next(i for i, line in enumerate(lines) if line.strip().upper() == "CREATE ENUMERATION PART_OF_SPEECH_T = {")
          for i in range(enum_start, min(len(lines), enum_start + 24)):
              if lines[i].strip().startswith("}"):
                  break
              print("MQL_POS_ENUM", i + 1, lines[i].strip()[:64])
          sp = next(i for i, line in enumerate(lines) if line.strip().lower() == "sp : part_of_speech_t;")
          headers = [(i + 1, line.strip()[:100]) for i, line in enumerate(lines[:sp])
                     if "CREATE OBJECT TYPE" in line.upper()]
          print("MQL_SP_SCHEMA_HEADER", headers[-3:], "FEATURE_LINE", sp + 1)
          PY
          python scripts/research/i027b3_extract_mql.py --input upstream/source/0.2/extraBiblical.mql.bz2 --verify-frozen docs/research/data/i027b3/extrabiblical-mql-pos-evidence.json
          python scripts/research/i027b3_extract_mql.py --input upstream/source/0.2/extraBiblical.mql.bz2 --verify-frozen docs/research/data/i034f/extrabiblical-mql-pos-enum.json >/dev/null
