name: I-020 approximate semantic execution

on:
  pull_request:
    paths:
      - "src/tfont/semantic_ir.py"
      - "src/tfont/semantic_resolver.py"
      - "src/tfont/semantic_execution.py"
      - "src/tfont/__init__.py"
      - "tests/i020/**"
      - "docs/research/data/generated/i020/runtime-reconciliation.json"
      - "scripts/research/i020_runtime_reconciliation.py"
      - ".github/workflows/i020-approximate-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i020:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run I-020 contract
        run: python -m unittest discover -s tests/i020 -p 'test*.py'
      - name: Preserve exact resolver and execution contracts
        run: |
          python -m unittest tests.i006.test_semantic_resolver_contract
          python -m unittest tests.i008.test_execution_red
          python -m unittest tests.i015.test_exact_conjunction_behavior
      - name: Reproduce I-020 research anchors
        run: |
          python scripts/research/i020_runtime_reconciliation.py > /tmp/i020-runtime-reconciliation.json
          cmp /tmp/i020-runtime-reconciliation.json docs/research/data/generated/i020/runtime-reconciliation.json
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist
      - name: Verify isolated wheel approximate API
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile

          wheel = next(pathlib.Path("dist").glob("tfont-*.whl"))
          with tempfile.TemporaryDirectory() as tmp:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--target", tmp, str(wheel)]
              )
              code = """
          import tfont
          required = [
              "ApproximateSemanticResolveRequest",
              "ApproximateSemanticConjunctionRequest",
              "semantic_resolve_approximate",
              "semantic_resolve_approximate_conjunction",
              "ApproximateExecutionError",
              "execute_approximate_semantic",
              "execute_approximate_conjunction",
          ]
          missing = [name for name in required if not hasattr(tfont, name)]
          if missing:
              raise SystemExit(f"missing approximate API from wheel: {missing}")
          """
              subprocess.check_call([sys.executable, "-c", code], env={"PYTHONPATH": tmp})
          PY
