name: I-157 PEP 639 mixed-license packaging

on:
  push:
    branches:
      - impl/157-pep639-license
    paths:
      - 'pyproject.toml'
      - 'tests/packaging/test_pep639_mixed_license.py'
      - 'tests/packaging/test_schema_authority.py'
      - 'tests/i009/**'
      - 'docs/research/157-pep639-mixed-license.md'
      - 'docs/plans/157-pep639-mixed-license-plan.md'
      - '.github/workflows/i157-pep639-license.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'tests/packaging/test_pep639_mixed_license.py'
      - 'tests/packaging/test_schema_authority.py'
      - 'tests/i009/**'
      - 'docs/research/157-pep639-mixed-license.md'
      - 'docs/plans/157-pep639-mixed-license-plan.md'
      - '.github/workflows/i157-pep639-license.yml'

permissions:
  contents: read

jobs:
  packaging:
    name: packaging contract (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build frontend
        run: python -m pip install -e . build
      - name: Verify mixed-license wheel and sdist contract
        env:
          I157_PACKAGING_TEST: '1'
        run: python -m unittest tests.packaging.test_pep639_mixed_license -v
      - name: Existing production-bundle regression control
        run: python -m unittest discover -s tests/i009 -p 'test_*.py' -v
      - name: Small packaging control
        run: python -m unittest tests.packaging.test_schema_authority -v
