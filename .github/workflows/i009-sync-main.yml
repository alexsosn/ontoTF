name: I-009 temporary sync main

on:
  push:
    branches:
      - impl/i009-production-noun-bundles
    paths:
      - '.github/workflows/i009-sync-main.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/impl/i009-production-noun-bundles'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: impl/i009-production-noun-bundles
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main without rewriting I-009 history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify merged I-009 and I-011 contracts before push
        run: |
          python -m pip install -e . pytest
          python -m pytest tests/i009 tests/i011 -q
      - name: Push merge commit
        run: git push origin HEAD:impl/i009-production-noun-bundles
