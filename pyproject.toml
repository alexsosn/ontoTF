[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfont"
version = "0.1.1"
description = "Ontological layer for Text-Fabric corpora"
requires-python = ">=3.10"
license = "MIT AND CC-BY-3.0"
license-files = [
  "LICENSE",
  "src/tfont/resources/ontologies/olia/d3bd4f1aef9047b33186bfb2a1795401f3f1a4a6/LICENSE.data",
  "src/tfont/resources/ontologies/olia/d3bd4f1aef9047b33186bfb2a1795401f3f1a4a6/ATTRIBUTION.txt",
]
dependencies = [
  "jsonschema>=4.26,<5",
  "rfc8785>=0.1.4,<0.2",
  "ruamel.yaml>=0.19.1,<0.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tfont = [
  "schemas/*.json",
  "resources/profiles/*/*/*.json",
  "resources/profiles/*/*/parent/*.json",
  "resources/profiles/*/*/mappings/*.json",
  "resources/profiles/*/*/evidence/*.json",
  "resources/ontologies/*/*/*.json",
  "resources/ontologies/*/*/*.owl",
  "resources/ontologies/*/*/*.txt",
  "resources/ontologies/*/*/*.data",
]
