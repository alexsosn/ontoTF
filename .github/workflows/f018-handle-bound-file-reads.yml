# Issue: #90
name: F-018 handle-bound file reads

on:
  push:
    branches:
      - research/f-018-handle-bound-file-reads
    paths:
      - src/tfont/parent_identity.py
      - tests/f018/**
      - tests/f012/**
      - tests/f014/**
      - tests/i003/**
      - docs/research/F-018-handle-bound-file-reads.md
      - docs/plans/F-018-handle-bound-file-reads-plan.md
      - .github/workflows/f018-handle-bound-file-reads.yml
  pull_request:
    paths:
      - src/tfont/parent_identity.py
      - tests/f018/**
      - tests/f012/**
      - tests/f014/**
      - tests/i003/**
      - docs/research/F-018-handle-bound-file-reads.md
      - docs/plans/F-018-handle-bound-file-reads-plan.md
      - .github/workflows/f018-handle-bound-file-reads.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f018-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  handle-bound-file-reads:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.12', '3.14']
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build

      - name: Run F-018 established controls
        run: python -m unittest tests.f018.test_handle_bound_file_reads.HandleBoundFileReadControls -v

      - name: Run intended F-018 RED/GREEN contract
        run: |
          python -m unittest tests.f018.test_handle_bound_file_reads.HandleBoundFileReadREDTests -v
          python -m unittest tests.f018.test_win32_handle_ownership -v

      - name: Run F-012 regressions
        if: always()
        run: python -m unittest discover -s tests/f012 -v

      - name: Run F-014 regressions
        if: always()
        run: python -m unittest discover -s tests/f014 -v

      - name: Run I-003 regressions
        if: always()
        run: python -m unittest discover -s tests/i003 -v
