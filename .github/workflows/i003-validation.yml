name: I-003 parent component identity

on:
  push:
    branches:
      - impl/i-003-parent-component-identity
    paths:
      - .github/workflows/i003-validation.yml
      - docs/research/I-003-parent-component-identity-research.md
      - docs/plans/I-003-parent-component-identity-plan.md
      - pyproject.toml
      - src/tfont/**
      - tests/i003/**
  pull_request:
    paths:
      - .github/workflows/i003-validation.yml
      - docs/research/I-003-parent-component-identity-research.md
      - docs/plans/I-003-parent-component-identity-plan.md
      - pyproject.toml
      - tests/i003/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Show environment
        run: python --version

      - name: Run I-003 focused tests
        run: python -m unittest discover -s tests/i003 -v
