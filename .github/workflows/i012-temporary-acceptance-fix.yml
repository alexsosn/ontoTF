name: I-012 temporary acceptance assertion repair
on:
  push:
    branches:
      - impl/i012-clean-install-acceptance
    paths:
      - .github/workflows/i012-temporary-acceptance-fix.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: impl/i012-clean-install-acceptance
          persist-credentials: true
      - name: Correct canonical request assertion and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/acceptance/v01_noun.py')
          source = path.read_text(encoding='utf-8')
          old = '    require(result.resolution.request == request(), "resolution did not preserve the exact request")'
          new = '''    expected_request = request()
              actual_request = result.resolution.request
              require(actual_request.key == expected_request.key, "resolution changed the semantic request key")
              require(actual_request.semantic_mode == expected_request.semantic_mode, "resolution changed semantic mode")
              require(actual_request.corpora == tuple(sorted(expected_request.corpora)), "resolution did not canonicalize the requested corpora")'''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          assert source.count(old) == 1, 'old request assertion missing or repeated'
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/i012-temporary-acceptance-fix.yml
          git add scripts/acceptance/v01_noun.py
          git commit -m 'I-012: assert normalized resolver request without changing semantic key'
          git push origin HEAD:impl/i012-clean-install-acceptance