name: I-013 v0.1 release-candidate contract

on:
  push:
    branches:
      - impl/i013-v010-release
    paths:
      - 'tests/i013/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'docs/releases/**'
      - '.github/workflows/i013-release-candidate.yml'
  pull_request:
    paths:
      - 'tests/i013/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'docs/releases/**'
      - '.github/workflows/i013-release-candidate.yml'

permissions:
  contents: read

jobs:
  release-contract:
    name: release contract (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i013 -p 'test_*.py' -v

  regression-control:
    name: existing three-corpus regression control
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i009 -p 'test_*.py' -v
