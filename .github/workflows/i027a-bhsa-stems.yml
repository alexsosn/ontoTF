name: I-027A BHSA verbal-stem accounting

on:
  pull_request:
    paths:
      - "docs/research/I-027A-bhsa-verbal-stem-dispositions.md"
      - "docs/plans/I-027A-bhsa-verbal-stem-dispositions.md"
      - "docs/research/data/i027a/**"
      - "scripts/coverage/build_i027a_bhsa_verbal_stems.py"
      - "src/tfont/resources/coverage/p004-i027a-bhsa-stems-v1/**"
      - "tests/i027a/**"
      - ".github/workflows/i027a-bhsa-stems.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python scripts/coverage/build_i027a_bhsa_verbal_stems.py --check
      - run: python -m unittest tests.i027a.test_accounting_red tests.i027a.test_accounting_adversarial
