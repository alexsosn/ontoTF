# I-033E3 / #303: ONLY protected-base code executes with a GitHub API token.
# NEVER add pull_request_review: that event can run PR merge-commit workflow code.
name: Protected ontology batch reviewer

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  # GitHub executes issue_comment workflow code from the DEFAULT branch,
  # unlike pull_request_review (which uses an unsafe PR merge ref).
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ontology-batch-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  external-attestation:
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'ontology-batch-review')
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/ontoTF verify-review' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.issue.labels.*.name, 'ontology-batch-review')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base only (never PR head)
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install trusted code only
        run: python -m pip install -e .
      - name: Authenticate independent review of exact PR-head DATA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python scripts/mappings/check_external_review.py --from-pr-head | tee batch-review-attestation.json
      - name: Archive non-signature provenance report
        uses: actions/upload-artifact@v4
        with:
          name: ontology-batch-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_id }}
          path: batch-review-attestation.json
          if-no-files-found: error
          retention-days: 30

  publish-handoff:
    needs: external-attestation
    if: >-
      needs.external-attestation.result == 'success' &&
      (
        contains(github.event.pull_request.labels.*.name, 'ontology-batch-publish') ||
        contains(github.event.issue.labels.*.name, 'ontology-batch-publish')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Freshly verify accepted-only handoff before exclusive write
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/mappings/check_external_review.py --from-pr-head --publish-handoff
      - name: Bind pack bytes to protected workflow build provenance
        if: hashFiles('batch-review-pack.json') != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: batch-review-pack.json
      - uses: actions/upload-artifact@v4
        if: hashFiles('batch-review-pack.json') != ''
        with:
          name: ontology-overlay-handoff-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_id }}
          path: batch-review-pack.json
          if-no-files-found: error
          retention-days: 30
