name: D-003 README I-004 status

on:
  push:
    branches:
      - docs/d-003-i004-readme-status
    paths:
      - README.md
      - tests/docs/**
      - docs/research/D-003-i004-readme-status.md
      - docs/plans/D-003-i004-readme-status-plan.md
      - .github/workflows/d003-readme-i004-status.yml
  pull_request:
    paths:
      - README.md
      - tests/docs/**
      - docs/releases/v0.1.1.md
      - docs/research/D-003-i004-readme-status.md
      - docs/plans/D-003-i004-readme-status-plan.md
      - .github/workflows/d003-readme-i004-status.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme-status:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and packaging frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build
      - name: Run README documentation contract
        run: python -m unittest discover -s tests/docs -v
