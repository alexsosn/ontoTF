# Issue: #84
name: F-014 exact file path spellings

on:
  push:
    branches:
      - stability/f-014-windows-exact-file-paths
  pull_request:
    paths:
      - src/tfont/parent_identity.py
      - tests/f014/**
      - tests/i003/**
      - docs/research/F-014-windows-exact-file-paths.md
      - docs/plans/F-014-windows-exact-file-paths-plan.md
      - .github/workflows/f014-windows-exact-file-paths.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-file-spellings:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.14']
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run F-014 focused contract
        run: python -m unittest discover -s tests/f014 -v
      - name: Run I-003 regressions
        run: python -m unittest discover -s tests/i003 -v
